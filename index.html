<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人簡介 | 法政與 AI 教育專家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { background-color: #080f1e; color: #f0f4ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; position: relative; }

        /* 背景流光效果 */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 60% 40% at 20% 10%, rgba(56,189,248,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 80% 80%, rgba(129,140,248,0.07) 0%, transparent 70%);
            pointer-events: none;
        }

        .wrap { position: relative; z-index: 1; }
        .glass { background: rgba(15, 25, 50, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.07); }
        .glass-bright { background: rgba(20, 32, 65, 0.80); backdrop-filter: blur(20px); border: 1px solid rgba(56,189,248,0.15); }
        .gradient-text { background: linear-gradient(95deg, #38bdf8 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        /* 人格選擇器 */
        .persona-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
        .persona-btn {
            cursor: pointer; border-radius: 12px; padding: 10px 6px;
            border: 1.5px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            text-align: center; font-size: 11px; color: #94a3b8;
            transition: all 0.25s;
        }
        .persona-btn:hover { border-color: rgba(56,189,248,0.4); color: #e2e8f0; background: rgba(56,189,248,0.06); }
        .persona-btn.active { border-color: #38bdf8; background: rgba(56,189,248,0.12); color: #7dd3fc; }
        .persona-btn .icon { font-size: 22px; display: block; margin-bottom: 4px; }
        .persona-btn .name { font-weight: 600; display: block; margin-bottom: 2px; font-size: 12px; }

        /* API Key 區塊 */
        .key-row { display: flex; gap: 6px; align-items: center; }
        .key-input {
            flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 8px 12px; color: #e2e8f0; font-size: 12px;
            font-family: monospace; transition: border-color 0.2s;
        }
        .key-input:focus { outline: none; border-color: #38bdf8; }
        .btn-verify {
            background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.3);
            color: #7dd3fc; border-radius: 10px; padding: 8px 14px;
            font-size: 12px; cursor: pointer; white-space: nowrap; transition: all 0.2s;
        }
        .btn-verify:hover { background: rgba(56,189,248,0.25); }
        .key-status { margin-top: 6px; font-size: 11px; border-radius: 8px; padding: 6px 10px; display: none; }
        .key-ok { display: block; background: rgba(16,185,129,0.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.2); }
        .key-err { display: block; background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }
        .key-loading { display: block; background: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); }

        /* 聊天區 */
        .chat-area {
            height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
            padding: 4px 2px; scrollbar-width: thin; scrollbar-color: rgba(56,189,248,0.2) transparent;
        }
        .bubble-ai {
            align-self: flex-start; max-width: 85%;
            background: rgba(30,41,80,0.9); border: 1px solid rgba(56,189,248,0.15);
            border-radius: 4px 16px 16px 16px; padding: 10px 14px;
            font-size: 13px; color: #cbd5e1; line-height: 1.6;
            animation: fadeInUp 0.3s ease;
        }
        .bubble-user {
            align-self: flex-end; max-width: 85%;
            background: linear-gradient(135deg, #1e40af, #1e3a8a);
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 16px 4px 16px 16px; padding: 10px 14px;
            font-size: 13px; color: #e0e7ff; line-height: 1.6;
            animation: fadeInUp 0.3s ease;
        }
        .bubble-system { align-self: center; font-size: 11px; color: #475569; background: rgba(255,255,255,0.03); border-radius: 99px; padding: 4px 12px; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* 打字動畫 */
        .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
        .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: #38bdf8; opacity: 0.6; animation: dot-bounce 1.2s infinite ease-in-out; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot-bounce { 0%,80%,100% { transform: translateY(0); opacity:0.4; } 40% { transform: translateY(-5px); opacity:1; } }

        .chat-input { flex: 1; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; padding: 10px 14px; color: #e2e8f0; font-size: 13px; }
        .chat-input:focus { outline: none; border-color: rgba(56,189,248,0.5); }
        .btn-send { background: linear-gradient(135deg, #0284c7, #4338ca); border: none; border-radius: 12px; padding: 10px 18px; color: #fff; cursor: pointer; transition: all 0.2s; }
        .btn-send:disabled { opacity: 0.35; cursor: not-allowed; }
        .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 12px 0; }

        /* 頭像光圈 */
        .avatar-wrap { position: relative; display: inline-block; }
        .avatar-wrap::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(56,189,248,0.3); animation: pulse-ring 2.5s infinite; }
        @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.7; } 70% { transform: scale(1.1); opacity: 0; } 100% { transform: scale(1.1); opacity: 0; } }
        .tag { display: inline-block; background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.2); color: #7dd3fc; border-radius: 99px; font-size: 11px; padding: 2px 10px; }
    </style>
</head>
<body class="p-4 md:p-10">
<div class="wrap max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">

    <div class="md:col-span-1 space-y-5">
        <div class="glass p-6 rounded-2xl text-center">
            <div class="avatar-wrap mx-auto mb-5">
                <div class="w-24 h-24 rounded-full flex items-center justify-center text-2xl font-bold" style="background: linear-gradient(135deg,#0ea5e9,#6366f1);">
                    <i class="fas fa-user-graduate" style="font-size:36px;color:#fff;"></i>
                </div>
            </div>
            <h1 class="text-xl font-bold mb-1">教育與 AI 專家</h1>
            <p style="color:#38bdf8;font-size:13px;" class="mb-4">法政碩士 ｜ AI 閱卷顧問</p>
            <div class="flex justify-center gap-3 flex-wrap">
                <span class="tag"><i class="fab fa-linkedin mr-1"></i>LinkedIn</span>
                <span class="tag"><i class="fas fa-envelope mr-1"></i>Email</span>
            </div>
        </div>
